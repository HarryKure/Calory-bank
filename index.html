<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A personal weekly calorie balance tracker — earn kcal from workouts, spend on snacks, and see your weekly score.">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cal Bank">
<meta name="theme-color" content="#0f0f0f">
<title>Cal Bank</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-startup-image" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #222;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0ede8; --muted: #888;
    --green: #7dff9b; --green-dim: rgba(125,255,155,0.12);
    --red: #ff7d6b; --red-dim: rgba(255,125,107,0.12);
    --amber: #ffc96b; --radius: 16px;
    --font-head: 'Syne', sans-serif; --font-mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font-head); overscroll-behavior: none; }
  body { display: flex; flex-direction: column; max-width: 430px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* Header */
  header { padding: max(52px, calc(env(safe-area-inset-top) + 20px)) 20px 0; display: flex; align-items: flex-end; justify-content: space-between; }
  header h1 { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  /* Date nav */
  .date-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; }
  .date-arrow { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; color: var(--text); transition: background 0.15s, transform 0.1s; user-select: none; flex-shrink: 0; }
  .date-arrow:active { background: var(--surface2); transform: scale(0.94); }
  .date-arrow:disabled, .date-arrow.disabled { opacity: 0.2; pointer-events: none; }
  .date-center { text-align: center; flex: 1; }
  .date-label { font-family: var(--font-mono); font-size: 15px; color: var(--text); }
  .date-sublabel { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--font-mono); min-height: 16px; }
  .today-btn { font-size: 10px; color: var(--amber); background: none; border: none; cursor: pointer; font-family: var(--font-mono); padding: 6px 4px; margin: -6px -4px 0; display: none; }

  /* Hero card */
  .hero-wrap { padding: 14px 20px 0; }
  .hero-card { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 18px 18px 14px; overflow: hidden; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .balance-col { }
  .balance-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .balance-amount { font-family: var(--font-mono); font-size: 44px; font-weight: 500; line-height: 1; color: var(--green); transition: color 0.3s; }
  .balance-amount.negative { color: var(--red); }
  .balance-unit { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .kg-col { text-align: right; }
  .kg-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .kg-val { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
  .kg-val.loss { color: var(--green); }
  .kg-val.gain { color: var(--red); }
  .kg-note { font-size: 10px; color: var(--muted); font-family: var(--font-mono); margin-top: 3px; }
  .hero-divider { height: 0.5px; background: var(--border); margin: 14px 0 12px; }
  .tab-group { display: flex; gap: 4px; }
  .tab-btn { font-family: var(--font-mono); font-size: 10px; padding: 8px 12px; border-radius: 20px; cursor: pointer; border: 0.5px solid var(--border); color: var(--muted); background: none; transition: all 0.15s; min-height: 32px; }
  .tab-btn.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }
  .tab-btn:active { transform: scale(0.94); }
  canvas#chartCanvas { width: 100% !important; display: block; }

  /* Stats */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 20px 0; }
  .stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .stat-val { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
  .stat-val.green { color: var(--green); }
  .stat-val.red { color: var(--red); }
  .stat-sub { font-size: 10px; color: var(--muted); margin-top: 3px; font-family: var(--font-mono); }

  /* Add buttons */
  .add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 20px 0; }
  .add-btn { border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 18px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform 0.12s, background 0.15s; background: var(--surface); text-align: left; width: 100%; }
  .add-btn:active { transform: scale(0.96); }
  .add-btn.earn { background: var(--green-dim); border-color: rgba(125,255,155,0.2); }
  .add-btn.spend { background: var(--red-dim); border-color: rgba(255,125,107,0.2); }
  .add-btn .icon { font-size: 22px; }
  .add-btn .btn-main { font-size: 15px; font-weight: 700; }
  .add-btn .btn-sub { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  /* Log */
  .log-section { flex: 1; padding: 20px 20px 0; }
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .log-header h3 { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .clear-btn { font-size: 11px; color: var(--muted); background: none; border: none; cursor: pointer; font-family: var(--font-head); padding: 10px 0; min-height: 40px; display: flex; align-items: center; }
  .log-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 24px; }
  .log-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 4px 4px 4px 14px; display: flex; justify-content: space-between; align-items: center; animation: slideIn 0.2s ease; gap: 10px; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .log-item-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .log-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .log-meta { font-size: 11px; color: var(--muted); font-family: var(--font-mono); display: block; }
  .log-right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .log-cal { font-family: var(--font-mono); font-size: 16px; font-weight: 500; }
  .log-edit-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 8px; margin: -8px 0 -8px -10px; border-radius: 8px; text-align: left; transition: background 0.12s; }
  .log-edit-btn:hover, .log-edit-btn:active { background: rgba(255,255,255,0.04); }
  .log-cal.pos { color: var(--green); }
  .log-cal.neg { color: var(--red); }
  .delete-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 12px; line-height: 1; transition: color 0.15s; opacity: 0.5; min-width: 40px; min-height: 40px; display: flex; align-items: center; justify-content: center; margin-right: -8px; }
  .delete-btn:hover, .delete-btn:active { color: var(--red); opacity: 1; }
  .empty-state { text-align: center; padding: 32px 0; color: var(--muted); font-size: 13px; font-family: var(--font-mono); }

  /* Dual chart labels */
  .dual-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .dual-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  canvas#weekCanvas, canvas#chartCanvas { width: 100% !important; display: block; }
  .chart-loading { height: 90px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
  .chart-loading { animation: pulse 1.4s ease-in-out infinite; }

  /* History scoreboard */
  .history-section { padding: 20px 20px 32px; }
  .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .history-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .history-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .history-stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .history-stat-label { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .history-stat-val { font-family: var(--font-mono); font-size: 14px; font-weight: 500; }
  .history-stat-val.pos { color: var(--green); }
  .history-stat-val.neg { color: var(--red); }
  .history-stat-sub { font-size: 9px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }

  /* Week game cards */
  .week-cards { display: flex; flex-direction: column; gap: 8px; }
  .week-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; width: 100%; text-align: left; min-height: 44px; }
  .week-card:active { border-color: var(--border2); transform: scale(0.98); }
  .week-card.current-week { border-color: var(--amber); }
  .week-card.win { border-left: 3px solid var(--green); }
  .week-card.loss { border-left: 3px solid var(--red); }
  .week-card.empty { border-left: 3px solid var(--border2); opacity: 0.5; }
  .wc-badge { font-size: 18px; flex-shrink: 0; width: 32px; text-align: center; }
  .wc-info { flex: 1; min-width: 0; }
  .wc-dates { font-size: 11px; color: var(--muted); font-family: var(--font-mono); margin-bottom: 3px; }
  .wc-bar-wrap { height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
  .wc-bar { height: 4px; border-radius: 2px; transition: width 0.4s; }
  .wc-bar.pos { background: var(--green); }
  .wc-bar.neg { background: var(--red); }
  .wc-score { font-family: var(--font-mono); font-size: 15px; font-weight: 500; flex-shrink: 0; text-align: right; }
  .wc-score.pos { color: var(--green); }
  .wc-score.neg { color: var(--red); }
  .wc-score.zero { color: var(--muted); }
  .wc-kg { font-size: 10px; color: var(--muted); font-family: var(--font-mono); text-align: right; margin-top: 2px; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 100; align-items: flex-end; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 24px 24px 0 0; width: 100%; max-width: 430px; animation: slideUp 0.28s cubic-bezier(.4,0,.2,1); max-height: 88vh; display: flex; flex-direction: column; }
  @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
  .modal-header { padding: 28px 24px 0; flex-shrink: 0; }
  .modal-header h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  .modal-scroll { flex: 1; overflow-y: auto; padding: 0 24px; }
  .modal-footer { padding: 12px 24px calc(16px + env(safe-area-inset-bottom)); flex-shrink: 0; background: var(--surface); border-top: 0.5px solid var(--border); }
  .modal-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .quick-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .pill { font-family: var(--font-mono); font-size: 13px; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 20px; padding: 8px 14px; cursor: pointer; transition: background 0.12s, transform 0.1s; white-space: nowrap; text-align: left; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .pill:active { transform: scale(0.96); }
  .pill.selected { border-color: var(--green); color: var(--green); background: var(--green-dim); }
  .pill.selected.spend-mode { border-color: var(--red); color: var(--red); background: var(--red-dim); }
  .custom-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .cal-input { flex: 1; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: var(--font-mono); font-size: 18px; outline: none; }
  .cal-input::placeholder { color: var(--muted); }
  .name-input { width: 100%; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 10px; padding: 12px 14px; color: var(--text); font-family: var(--font-head); font-size: 15px; outline: none; margin-bottom: 16px; }
  .name-input::placeholder { color: var(--muted); }
  .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-cancel { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 12px; padding: 14px; font-family: var(--font-head); font-size: 15px; color: var(--muted); cursor: pointer; }
  .btn-confirm { border: none; border-radius: 12px; padding: 14px; font-family: var(--font-head); font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-confirm.earn { background: var(--green); color: #0f0f0f; }
  .btn-confirm.spend { background: var(--red); color: #0f0f0f; }
  .delete-entry-link { width: 100%; background: none; border: none; color: var(--red); font-family: var(--font-mono); font-size: 12px; padding: 12px 0; margin-top: 4px; cursor: pointer; text-align: center; opacity: 0.75; }
  .delete-entry-link:hover, .delete-entry-link:active { opacity: 1; }

  /* Confirm dialog */
  .confirm-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 200; align-items: center; justify-content: center; padding: 24px; }
  .confirm-bg.open { display: flex; }
  .confirm-box { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 18px; padding: 22px 20px; width: 100%; max-width: 340px; animation: popIn 0.18s ease; }
  @keyframes popIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
  .confirm-msg { font-size: 15px; line-height: 1.4; margin-bottom: 18px; }
  .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .confirm-cancel { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 10px; padding: 12px; font-family: var(--font-head); font-size: 14px; color: var(--muted); cursor: pointer; }
  .confirm-ok { background: var(--red); border: none; border-radius: 10px; padding: 12px; font-family: var(--font-head); font-size: 14px; font-weight: 700; color: #0f0f0f; cursor: pointer; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 12px; padding: 12px 18px; font-family: var(--font-mono); font-size: 13px; color: var(--text); z-index: 300; opacity: 0; transition: transform 0.25s cubic-bezier(.4,0,.2,1), opacity 0.25s; pointer-events: none; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast .toast-icon { margin-right: 6px; }
</style>
</head>
<body>

<header>
  <h1>Cal Bank</h1>
</header>

<div class="date-nav">
  <button type="button" class="date-arrow" id="datePrev" onclick="shiftDay(-1)" aria-label="Previous day">‹</button>
  <div class="date-center">
    <div class="date-label" id="dateLabel" aria-live="polite">Today</div>
    <div class="date-sublabel" id="dateSublabel"></div>
    <button type="button" class="today-btn" id="todayBtn" onclick="goToday()">back to today</button>
  </div>
  <button type="button" class="date-arrow" id="dateNext" onclick="shiftDay(1)" aria-label="Next day">›</button>
</div>

<div class="hero-wrap">
  <div class="hero-card">
    <div class="hero-top">
      <div class="balance-col">
        <div class="balance-label" id="balanceLabel">This week</div>
        <div class="balance-amount" id="balanceAmt" aria-live="polite">0</div>
        <div class="balance-unit" id="balanceUnit">kcal · resets monday</div>
      </div>
      <div class="kg-col">
        <div class="kg-label">Est. change</div>
        <div class="kg-val loss" id="kgVal" aria-live="polite">0.00 kg</div>
        <div class="kg-note" id="kgNote">surplus → loss</div>
      </div>
    </div>
    <div class="hero-divider"></div>
    <!-- Top: current week daily bars -->
    <div class="dual-label" id="weekCanvasLabel">this week · day by day</div>
    <canvas id="weekCanvas" height="90" role="img" aria-labelledby="weekCanvasLabel"></canvas>
    <div class="hero-divider" style="margin:12px 0 10px"></div>
    <!-- Bottom: recent weeks -->
    <div class="dual-header">
      <div class="dual-label" id="chartCanvasLabel">recent weeks</div>
      <div class="tab-group" id="rangeTabs">
        <button type="button" class="tab-btn active" onclick="setRange('week',this)">8w</button>
        <button type="button" class="tab-btn" onclick="setRange('month',this)">13w</button>
        <button type="button" class="tab-btn" onclick="setRange('year',this)">52w</button>
      </div>
    </div>
    <canvas id="chartCanvas" height="90" role="img" aria-labelledby="chartCanvasLabel"></canvas>
  </div>
</div>

<div class="stats-row">
  <div class="stat">
    <div class="stat-label">Earned</div>
    <div class="stat-val green" id="earnedAmt">+0</div>
    <div class="stat-sub" id="earnedSub">today</div>
  </div>
  <div class="stat">
    <div class="stat-label">Spent</div>
    <div class="stat-val red" id="spentAmt">-0</div>
    <div class="stat-sub" id="spentSub">today</div>
  </div>
</div>

<div class="add-row">
  <button type="button" class="add-btn earn" onclick="openModal('earn')">
    <div class="icon" aria-hidden="true">🏃</div>
    <div class="btn-main">Log workout</div>
    <div class="btn-sub">earn kcal</div>
  </button>
  <button type="button" class="add-btn spend" onclick="openModal('spend')">
    <div class="icon" aria-hidden="true">🍪</div>
    <div class="btn-main">Log snack</div>
    <div class="btn-sub">spend kcal</div>
  </button>
</div>

<div class="log-section">
  <div class="log-header">
    <h3 id="logTitle">Today's activity</h3>
    <button class="clear-btn" onclick="clearAll()">clear all</button>
  </div>
  <div class="log-list" id="logList"></div>
</div>

<!-- Weekly history scoreboard -->
<div class="history-section">
  <div class="history-header">
    <h3 class="history-title">🏆 Weekly scores</h3>
    <div class="tab-group">
      <button class="tab-btn active" id="histMonthBtn" onclick="setHistoryRange('month',this)">8w</button>
      <button class="tab-btn" id="histYearBtn" onclick="setHistoryRange('year',this)">52w</button>
    </div>
  </div>
  <div class="history-stats" id="historyStats"></div>
  <div class="week-cards" id="weekCards"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="closeModalBg(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Log workout</h2>
    </div>
    <div class="modal-scroll">
      <div id="recentSection" style="display:none">
        <div class="modal-label">Recent</div>
        <div class="quick-pills" id="recentList"></div>
      </div>
      <div class="modal-label">Quick select</div>
      <div class="quick-pills" id="quickPills"></div>
      <label class="modal-label" for="nameInput">Name (optional)</label>
      <input class="name-input" id="nameInput" placeholder="e.g. Morning run" autocomplete="off" maxlength="60" />
      <label class="modal-label" for="calInput">Calories</label>
      <div class="custom-row">
        <input class="cal-input" id="calInput" type="number" inputmode="numeric" placeholder="300" min="1" max="9999" autocomplete="off" />
      </div>
      <button type="button" id="deleteFromModal" class="delete-entry-link" onclick="deleteFromModal()" style="display:none">Delete this entry</button>
    </div>
    <div class="modal-footer">
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeModalDirect()">Cancel</button>
        <button type="button" class="btn-confirm earn" id="confirmBtn" onclick="addEntry()">Add</button>
      </div>
    </div>
  </div>
</div>

<!-- Custom confirm dialog (replaces window.confirm for reliable PWA behaviour) -->
<div class="confirm-bg" id="confirmBg">
  <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmMsg">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-actions">
      <button type="button" class="confirm-cancel" id="confirmCancelBtn">Cancel</button>
      <button type="button" class="confirm-ok" id="confirmOkBtn">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const KCAL_PER_KG = 7700;
const EARN_PRESETS = [{name:'Walk',cal:150},{name:'Run',cal:350},{name:'Gym',cal:400},{name:'Cycling',cal:380},{name:'Swim',cal:300},{name:'Yoga',cal:180}];
const SPEND_PRESETS = [{name:'Fruit',cal:80},{name:'Snack bar',cal:180},{name:'Chocolate',cal:220},{name:'Crisps',cal:160},{name:'Ice cream',cal:280},{name:'Cookie',cal:140}];

// ── Date helpers ─────────────────────────────────────────
function dateKey(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseKey(k) { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function todayKey() { return dateKey(new Date()); }
function addDays(k,n) { const d=parseKey(k); d.setDate(d.getDate()+n); return dateKey(d); }
function formatLabel(k) {
  const tk=todayKey();
  if (k===tk) return 'Today';
  if (k===addDays(tk,-1)) return 'Yesterday';
  return parseKey(k).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function formatSub(k) { return parseKey(k).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); }
function shortDay(k) { return parseKey(k).toLocaleDateString('en-GB',{weekday:'short'}); }
function shortDate(k) { const d=parseKey(k); return String(d.getDate())+'/'+String(d.getMonth()+1); }

// ── Utilities ────────────────────────────────────────────
function esc(str) {
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}
function fmtNum(n) {
  const sign = n >= 0 ? '+' : '-';
  return sign + Math.abs(n).toLocaleString('en-GB');
}
let toastTimer = null;
function showToast(msg, icon) {
  const el = document.getElementById('toast');
  el.textContent = (icon ? icon+'  ' : '') + msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── State ────────────────────────────────────────────────
function loadState() {
  try {
    const raw = localStorage.getItem('calbank2');
    if (!raw) return { log: [], streak: 0, lastDay: null };
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.log)) return { log: [], streak: 0, lastDay: null };
    // Migrate from old pre-weekly format
    if (parsed.earned !== undefined) return { log: [], streak: parsed.streak||0, lastDay: parsed.lastDay||null };
    return parsed;
  } catch (e) {
    console.warn('Could not load saved data, starting fresh.', e);
    return { log: [], streak: 0, lastDay: null };
  }
}
let state = loadState();

let viewDate = todayKey();
let chartRange = 'week';
let mode = 'earn';
let chart = null;

function save() {
  try {
    localStorage.setItem('calbank2', JSON.stringify(state));
  } catch (e) {
    console.error('Could not save — storage may be full.', e);
    alert('Could not save your entry. Your device storage may be full.');
  }
}

// ── Derived ──────────────────────────────────────────────
function getDayNet(k) {
  return state.log.filter(e=>e.dateKey===k).reduce((s,e)=>s+(e.type==='earn'?e.cal:-e.cal),0);
}
function getCumulative(upToKey) {
  return state.log.filter(e=>e.dateKey<=upToKey).reduce((s,e)=>s+(e.type==='earn'?e.cal:-e.cal),0);
}
function getWeekMonday(k) {
  const d = parseKey(k);
  const dow = d.getDay(); // 0=Sun
  const offset = dow===0 ? -6 : 1-dow;
  return addDays(k, offset);
}
function getWeekBalance(k) {
  const monday = getWeekMonday(k);
  return state.log
    .filter(e=>e.dateKey>=monday && e.dateKey<=k)
    .reduce((s,e)=>s+(e.type==='earn'?e.cal:-e.cal),0);
}
function getWeekScore(monday) {
  const sunday = addDays(monday,6);
  return state.log
    .filter(e=>e.dateKey>=monday && e.dateKey<=sunday)
    .reduce((s,e)=>s+(e.type==='earn'?e.cal:-e.cal),0);
}
function getDayTotals(k) {
  let earned=0,spent=0;
  state.log.filter(e=>e.dateKey===k).forEach(e=>{ if(e.type==='earn') earned+=e.cal; else spent+=e.cal; });
  return {earned,spent};
}

// Chart window — only used for weekly scores chart now
function getWeekMondays(n) {
  const currentMonday = getWeekMonday(todayKey());
  const mondays=[];
  for(let i=n-1;i>=0;i--) mondays.push(addDays(currentMonday,-i*7));
  return mondays;
}

let weekChart = null;

function renderChart() {
  if (typeof Chart === 'undefined') {
    // Chart.js loads synchronously before this script normally, but on a very
    // slow connection it may not be ready yet — retry shortly rather than
    // leaving the canvas area blank.
    setTimeout(renderChart, 200);
    return;
  }
  const today = todayKey();
  const viewMonday = getWeekMonday(viewDate);

  // ── Top: current week's day-by-day bars ──
  const weekCtx = document.getElementById('weekCanvas').getContext('2d');
  if (weekChart) { weekChart.destroy(); weekChart=null; }
  const weekDays=[];
  for(let i=0;i<7;i++) weekDays.push(addDays(viewMonday,i));
  const nets = weekDays.map(k=>getDayNet(k));
  const isFuture = weekDays.map(k=>k>today);
  const isViewDay = weekDays.map(k=>k===viewDate);

  weekChart = new Chart(weekCtx, {
    type:'bar',
    data:{labels:weekDays.map(k=>shortDay(k)), datasets:[{
      data:nets,
      backgroundColor:nets.map((v,i)=>
        isFuture[i]?'rgba(255,255,255,0.05)'
        :isViewDay[i]?(v>=0?'#7dff9b':'#ff7d6b')
        :v>=0?'rgba(125,255,155,0.4)':'rgba(255,125,107,0.4)'
      ),
      borderColor:nets.map((v,i)=>isFuture[i]?'transparent':v>=0?'rgba(125,255,155,0.8)':'rgba(255,125,107,0.8)'),
      borderWidth:1, borderRadius:3
    }]},
    options:{
      responsive:true,
      onClick:(evt,els)=>{if(els.length){viewDate=weekDays[els[0].index];render();}},
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#1a1a1a',borderColor:'rgba(255,255,255,0.14)',borderWidth:1,
        titleColor:'#888',bodyColor:'#f0ede8',
        titleFont:{family:'DM Mono',size:10},bodyFont:{family:'DM Mono',size:11},
        callbacks:{title:items=>formatLabel(weekDays[items[0].dataIndex]),label:item=>' '+(item.raw>=0?'+':'')+item.raw+' kcal'}
      }},
      scales:{
        x:{ticks:{color:'#555',font:{family:'DM Mono',size:10}},grid:{color:'rgba(255,255,255,0.04)'},border:{color:'rgba(255,255,255,0.08)'}},
        y:{ticks:{color:'#555',font:{family:'DM Mono',size:10},callback:v=>(v>=0?'+':'')+v},grid:{color:'rgba(255,255,255,0.04)'},border:{color:'rgba(255,255,255,0.08)'}}
      }
    }
  });

  // ── Bottom: recent weeks standalone bars ──
  const n = chartRange==='week'?8:chartRange==='month'?13:52;
  const mondays = getWeekMondays(n);
  const scores = mondays.map(m=>getWeekScore(m));
  const isCurrentWeek = mondays.map(m=>m===getWeekMonday(todayKey()));

  const ctx = document.getElementById('chartCanvas').getContext('2d');
  if (chart) { chart.destroy(); chart=null; }

  chart = new Chart(ctx, {
    type:'bar',
    data:{
      labels:mondays.map(m=>{
        const d=parseKey(m);
        if(n<=13) return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
        return d.getDate()<=7?d.toLocaleDateString('en-GB',{month:'short'}):'';
      }),
      datasets:[{
        data:scores,
        backgroundColor:scores.map((s,i)=>isCurrentWeek[i]?(s>=0?'#7dff9b':'#ff7d6b'):(s>=0?'rgba(125,255,155,0.45)':'rgba(255,125,107,0.45)')),
        borderColor:scores.map(s=>s>=0?'rgba(125,255,155,0.8)':'rgba(255,125,107,0.8)'),
        borderWidth:1, borderRadius:3
      }]
    },
    options:{
      responsive:true,
      onClick:(evt,els)=>{
        if(!els.length) return;
        viewDate=mondays[els[0].index];
        render();
        window.scrollTo({top:0,behavior:'smooth'});
      },
      plugins:{legend:{display:false},tooltip:{
        backgroundColor:'#1a1a1a',borderColor:'rgba(255,255,255,0.14)',borderWidth:1,
        titleColor:'#888',bodyColor:'#f0ede8',
        titleFont:{family:'DM Mono',size:10},bodyFont:{family:'DM Mono',size:11},
        callbacks:{
          title:items=>{const m=mondays[items[0].dataIndex];return parseKey(m).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+parseKey(addDays(m,6)).toLocaleDateString('en-GB',{day:'numeric',month:'short'});},
          label:item=>{const v=item.raw,kg=Math.abs(v/KCAL_PER_KG).toFixed(2);return ' '+(v>=0?'+':'')+v+' kcal  ('+(v>=0?'-':'+')+kg+' kg)';}
        }
      }},
      scales:{
        x:{ticks:{color:'#555',font:{family:'DM Mono',size:9},maxRotation:0},grid:{color:'rgba(255,255,255,0.04)'},border:{color:'rgba(255,255,255,0.08)'}},
        y:{ticks:{color:'#555',font:{family:'DM Mono',size:9},callback:v=>(v>=0?'+':'')+v},grid:{color:'rgba(255,255,255,0.04)'},border:{color:'rgba(255,255,255,0.08)'}}
      }
    }
  });
}

// ── Render ───────────────────────────────────────────────
function render() {
  const isToday = viewDate===todayKey();

  document.getElementById('dateLabel').textContent = formatLabel(viewDate);
  document.getElementById('dateSublabel').textContent = isToday ? '' : formatSub(viewDate);
  document.getElementById('todayBtn').style.display = isToday ? 'none' : 'block';
  document.getElementById('dateNext').classList.toggle('disabled', isToday);

  const bal = getWeekBalance(viewDate);
  const monday = getWeekMonday(viewDate);
  const balEl = document.getElementById('balanceAmt');
  balEl.textContent = fmtNum(bal);
  balEl.className = 'balance-amount'+(bal<0?' negative':'');
  const isThisWeek = monday===getWeekMonday(todayKey());
  document.getElementById('balanceLabel').textContent = isThisWeek ? 'This week' : 'Week of '+parseKey(monday).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  document.getElementById('balanceUnit').textContent = 'kcal · resets every monday';

  const kgEl = document.getElementById('kgVal');
  kgEl.textContent = (bal>=0?'-':'+')+Math.abs(bal/KCAL_PER_KG).toFixed(2)+' kg';
  kgEl.className = 'kg-val '+(bal>=0?'loss':'gain');
  document.getElementById('kgNote').textContent = bal>=0 ? 'surplus → loss' : 'deficit → gain';

  const {earned,spent} = getDayTotals(viewDate);
  document.getElementById('earnedAmt').textContent = '+'+earned.toLocaleString('en-GB');
  document.getElementById('spentAmt').textContent = '-'+spent.toLocaleString('en-GB');
  const dayLbl = isToday ? 'today' : formatLabel(viewDate).toLowerCase();
  document.getElementById('earnedSub').textContent = dayLbl;
  document.getElementById('spentSub').textContent = dayLbl;

  const entries = state.log.filter(e=>e.dateKey===viewDate);
  const list = document.getElementById('logList');
  document.getElementById('logTitle').textContent = isToday ? "Today's activity" : formatLabel(viewDate);
  if (entries.length===0) {
    list.innerHTML='<div class="empty-state">no activity yet</div>';
  } else {
    list.innerHTML='';
    state.log.map((e,i)=>({e,i})).filter(({e})=>e.dateKey===viewDate).slice().reverse().forEach(({e:entry,i:globalIdx})=>{
      const div=document.createElement('div'); div.className='log-item';
      const sign=entry.type==='earn'?'+':'-', cls=entry.type==='earn'?'pos':'neg';
      div.innerHTML=`<button type="button" class="log-edit-btn" onclick="openEditEntry(${globalIdx})"><span class="log-item-left"><span class="log-name">${esc(entry.name)}</span><span class="log-meta">${esc(entry.time)}</span></span><span class="log-cal ${cls}">${sign}${entry.cal}</span></button><div class="log-right"><button type="button" class="delete-btn" onclick="deleteEntry(${globalIdx})">×</button></div>`;
      div.querySelector('.log-edit-btn').setAttribute('aria-label', `Edit ${entry.name}, ${sign}${entry.cal} kcal`);
      div.querySelector('.delete-btn').setAttribute('aria-label', `Remove ${entry.name} entry`);
      list.appendChild(div);
    });
  }

  renderChart();
  renderHistory();
}

// ── Controls ─────────────────────────────────────────────
function shiftDay(n) { const next=addDays(viewDate,n); if(next>todayKey()) return; viewDate=next; render(); }
function goToday() { viewDate=todayKey(); render(); }
function setRange(r,btn) {
  chartRange=r;
  document.querySelectorAll('#rangeTabs .tab-btn').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active'); renderChart();
}

// ── Recent entries history ────────────────────────────────
function getRecent(type) {
  try {
    const raw = localStorage.getItem('calbank-recent-' + type);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}
function saveRecent(type, name, cal) {
  let recent = getRecent(type);
  // Remove duplicates of same name, add to front
  recent = recent.filter(r => r.name.toLowerCase() !== name.toLowerCase());
  recent.unshift({ name, cal });
  recent = recent.slice(0, 10); // keep last 10
  try {
    localStorage.setItem('calbank-recent-' + type, JSON.stringify(recent));
  } catch (e) { console.warn('Could not save recent entry.', e); }
}

// ── Modal ────────────────────────────────────────────────
let modalTriggerEl = null;
let editingIndex = null;
function onModalKeydown(e) { if (e.key === 'Escape') closeModalDirect(); }

function openModal(m, prefillIdx) {
  mode=m;
  editingIndex = (prefillIdx !== undefined) ? prefillIdx : null;
  modalTriggerEl = document.activeElement;
  const prefill = editingIndex!==null ? state.log[editingIndex] : null;

  document.getElementById('calInput').value = prefill ? prefill.cal : '';
  document.getElementById('nameInput').value = prefill ? prefill.name : '';
  document.getElementById('modalTitle').textContent = prefill
    ? (m==='earn' ? 'Edit workout' : 'Edit snack')
    : (m==='earn' ? 'Log workout' : 'Log snack');
  document.getElementById('confirmBtn').textContent = prefill ? 'Save' : 'Add';
  document.getElementById('confirmBtn').className='btn-confirm '+m;
  document.getElementById('deleteFromModal').style.display = prefill ? 'block' : 'none';

  // Recent entries as pills
  const recent = getRecent(m);
  const recentSection = document.getElementById('recentSection');
  const recentList = document.getElementById('recentList');
  if (recent.length > 0) {
    recentSection.style.display = 'block';
    recentList.innerHTML = '';
    recent.forEach(r => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'pill';
      pill.textContent = r.name + ' · ' + r.cal;
      pill.title = r.name + ' · ' + r.cal + ' kcal';
      pill.onclick = () => {
        document.querySelectorAll('.pill').forEach(x=>x.classList.remove('selected','spend-mode'));
        pill.classList.add('selected'); if(m==='spend') pill.classList.add('spend-mode');
        document.getElementById('nameInput').value = r.name;
        document.getElementById('calInput').value = r.cal;
      };
      recentList.appendChild(pill);
    });
  } else {
    recentSection.style.display = 'none';
  }

  // Quick select presets
  const presets=m==='earn'?EARN_PRESETS:SPEND_PRESETS;
  const pillsEl=document.getElementById('quickPills');
  pillsEl.innerHTML='';
  presets.forEach(p=>{
    const pill=document.createElement('button'); pill.type='button'; pill.className='pill';
    pill.textContent=p.name+' · '+p.cal;
    pill.onclick=()=>{
      document.querySelectorAll('.pill').forEach(x=>x.classList.remove('selected','spend-mode'));
      pill.classList.add('selected'); if(m==='spend') pill.classList.add('spend-mode');
      document.getElementById('calInput').value=p.cal;
      document.getElementById('nameInput').value=p.name;
    };
    pillsEl.appendChild(pill);
  });
  document.getElementById('modalBg').classList.add('open');
  document.addEventListener('keydown', onModalKeydown);
  // Move focus into the dialog for keyboard/screen-reader users
  setTimeout(() => document.getElementById('nameInput').focus(), 50);
}
function openEditEntry(idx) {
  const entry = state.log[idx];
  if (!entry) return;
  openModal(entry.type, idx);
}

function closeModalDirect() {
  document.getElementById('modalBg').classList.remove('open');
  document.removeEventListener('keydown', onModalKeydown);
  if (modalTriggerEl && typeof modalTriggerEl.focus === 'function') modalTriggerEl.focus();
  editingIndex = null;
}
function closeModalBg(e) { if(e.target===document.getElementById('modalBg')) closeModalDirect(); }

async function deleteFromModal() {
  if (editingIndex===null) return;
  const idx = editingIndex;
  closeModalDirect();
  await deleteEntry(idx);
}

function addEntry() {
  const cal=Math.min(9999, parseInt(document.getElementById('calInput').value));
  if(!cal||cal<=0) return;
  const name=(document.getElementById('nameInput').value.trim()||(mode==='earn'?'Workout':'Snack')).slice(0,60);

  // Save to recent history either way — useful for future quick-select
  saveRecent(mode, name, cal);

  if (editingIndex !== null) {
    // ── Update existing entry in place ──
    const entry = state.log[editingIndex];
    if (entry) {
      entry.type = mode;
      entry.name = name;
      entry.cal = cal;
    }
    save(); render(); closeModalDirect();
    showToast(`Updated ${name} · ${mode==='earn'?'+':'-'}${cal} kcal`, '✏️');
    return;
  }

  // ── Create new entry ──
  const now=new Date();
  const timeStr=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  if (viewDate===todayKey()) {
    const today=now.toDateString();
    if (state.lastDay!==today) {
      state.streak=state.lastDay===new Date(now-86400000).toDateString()?state.streak+1:1;
      state.lastDay=today;
    }
  }

  state.log.push({type:mode,name,cal,dateKey:viewDate,time:timeStr});
  save(); render(); closeModalDirect();
  showToast(`${name} · ${mode==='earn'?'+':'-'}${cal} kcal`, mode==='earn'?'🏃':'🍪');
}

// ── Custom confirm dialog (more reliable than window.confirm in PWA contexts) ──
function confirmDialog(message) {
  return new Promise(resolve => {
    const bg = document.getElementById('confirmBg');
    document.getElementById('confirmMsg').textContent = message;
    bg.classList.add('open');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    const cleanup = (result) => {
      bg.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      document.removeEventListener('keydown', onKey);
      resolve(result);
    };
    const onOk = () => cleanup(true);
    const onCancel = () => cleanup(false);
    const onKey = (e) => { if (e.key==='Escape') cleanup(false); };
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    document.addEventListener('keydown', onKey);
    okBtn.focus();
  });
}

async function deleteEntry(idx) {
  const entry = state.log[idx];
  if (!entry) return;
  const sign = entry.type === 'earn' ? '+' : '-';
  const ok = await confirmDialog(`Delete "${entry.name}" (${sign}${entry.cal} kcal)?`);
  if (!ok) return;
  state.log.splice(idx, 1);
  save(); render();
  showToast('Entry removed', '🗑');
}

async function clearAll() {
  const label = viewDate === todayKey() ? "today's" : formatLabel(viewDate) + "'s";
  const ok = await confirmDialog(`Clear all ${label} activity?`);
  if (!ok) return;
  state.log = state.log.filter(e => e.dateKey !== viewDate);
  save(); render();
  showToast('Activity cleared', '🗑');
}

// ── History / Weekly Scores ───────────────────────────────
let historyRange = 'month';

function setHistoryRange(r, btn) {
  historyRange = r;
  document.querySelectorAll('#histMonthBtn,#histYearBtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderHistory();
}

function renderHistory() {
  const today = todayKey();
  const currentMonday = getWeekMonday(today);
  const n = historyRange==='month' ? 8 : 52;
  const weeks=[];
  for(let i=n-1;i>=0;i--) {
    const monday = addDays(currentMonday,-i*7);
    const sunday = addDays(monday,6);
    const score = getWeekScore(monday);
    weeks.push({monday,sunday,score});
  }

  // Stats
  const played = weeks.filter(w=>w.score!==0);
  const wins = played.filter(w=>w.score>0);
  const best = played.length ? played.reduce((a,b)=>a.score>b.score?a:b) : null;
  let streak=0;
  for(let i=weeks.length-1;i>=0;i--){ if(weeks[i].score>0) streak++; else break; }
  const winRate = played.length ? Math.round((wins.length/played.length)*100) : 0;

  document.getElementById('historyStats').innerHTML = `
    <div class="history-stat">
      <div class="history-stat-label">Win rate</div>
      <div class="history-stat-val ${winRate>=50?'pos':'neg'}">${winRate}%</div>
      <div class="history-stat-sub">${wins.length}/${played.length} weeks</div>
    </div>
    <div class="history-stat">
      <div class="history-stat-label">Best score</div>
      <div class="history-stat-val pos">${best?fmtNum(best.score):'—'}</div>
      <div class="history-stat-sub">${best?parseKey(best.monday).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''}</div>
    </div>
    <div class="history-stat">
      <div class="history-stat-label">🔥 Streak</div>
      <div class="history-stat-val ${streak>0?'pos':''}">${streak}w</div>
      <div class="history-stat-sub">${streak>0?'in a row':'no streak'}</div>
    </div>
  `;

  // Game cards — most recent first
  const maxAbs = Math.max(...weeks.map(w=>Math.abs(w.score)), 1);
  const container = document.getElementById('weekCards');
  container.innerHTML='';

  weeks.slice().reverse().forEach(w => {
    const isCurrent = w.monday===currentMonday;
    const win = w.score>0;
    const loss = w.score<0;

    const card = document.createElement('button');
    card.type = 'button';
    const cls = isCurrent?'current-week':win?'win':loss?'loss':'empty';
    card.className = `week-card ${cls}`;

    const badge = isCurrent?'⏱':win?'✅':loss?'❌':'·';
    const kg = Math.abs(w.score/KCAL_PER_KG).toFixed(2);
    const kgStr = w.score===0?'' : (w.score>0?'−':'+')+kg+' kg';
    const barPct = Math.round((Math.abs(w.score)/maxAbs)*100);
    const dateStr = parseKey(w.monday).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+parseKey(w.sunday).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const scoreStr = w.score===0?'no data':fmtNum(w.score)+' kcal';

    card.innerHTML = `
      <div class="wc-badge" aria-hidden="true">${badge}</div>
      <div class="wc-info">
        <div class="wc-dates">${dateStr}</div>
        <div class="wc-bar-wrap"><div class="wc-bar ${win?'pos':loss?'neg':''}" style="width:${barPct}%"></div></div>
      </div>
      <div>
        <div class="wc-score ${win?'pos':loss?'neg':'zero'}">${scoreStr}</div>
        <div class="wc-kg">${kgStr}</div>
      </div>
    `;
    card.setAttribute('aria-label', `Week of ${dateStr}, ${scoreStr}. View this week.`);
    card.onclick = () => { viewDate=w.monday>today?today:w.monday; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    container.appendChild(card);
  });
}

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script>
</body>
</html>
